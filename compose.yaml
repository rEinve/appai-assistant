services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appai_dev
      POSTGRES_USER: appai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appai-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - appai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appai -d appai_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  appai-postgres-data:
